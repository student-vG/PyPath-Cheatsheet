    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-primary: #6366f1;
            --accent-secondary: #818cf8;
            --accent-pink: #ec4899;
            --accent-blue: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
              font-family: "Roboto", sans-serif;

            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
        }

        /* Header */
        header {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: relative;
            top: 0;
            z-index: 1000;
            padding: 12px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-pink));
background: linear-gradient(135deg, #00DBDE, #FC00FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 0.9rem;
        }

        /* Search */
        .search-box {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            cursor: pointer;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 15px 0;
            scrollbar-width: thin;
        }

        .nav-tabs::-webkit-scrollbar {
            height: 5px;
        }

        .nav-tabs::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 10px;
        }

        .nav-tabs::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 10px;
        }

        .tab-btn {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .tab-btn:hover {
            background: var(--accent-primary);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));

            color: white;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            background: linear-gradient(135deg, #AC32E4, #7918F2, #4801FF);
            color: white;
            border-color: var(--accent-primary);
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            padding: 15px;
            background: var(--bg-card);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 8px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-pink));
            background: linear-gradient(135deg, #B3FFAB, #12FFF7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* Content Cards */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .topic-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .topic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-pink));
        }

        .topic-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.2);
            border-color: var(--accent-primary);
        }

        .topic-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .topic-number {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            background: linear-gradient(135deg, #3D4E81, #5753C9, #6E7FF3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .topic-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .topic-section {
            margin: 12px 0;
        }

        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .section-content {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .code-block {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
        }

        .code-block code {
            color: #7dd3fc;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tip-box {
            background: rgba(16, 185, 129, 0.1);
            border-left: 3px solid var(--success);
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .tip-box::before {
            content: '💡 ';
            font-size: 1.1rem;
        }

        /* Navigation Buttons */
        .nav-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 12px;
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 999;
        }

        .nav-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* Scroll to Top Button */
        .scroll-top {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            background: linear-gradient(135deg, #5F72BD, #9B23EA);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.3);
            z-index: 998;
        }

        .scroll-top.visible {
            opacity: 1;
        }

        .scroll-top:hover {
            transform: translateY(-3px);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .topic-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .header-content {
                flex-direction: column;
                gap: 10px;
            }

            .search-box {
                max-width: 100%;
            }

            .logo {
                font-size: 1.2rem;
            }

            .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 12px;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .topic-card {
                padding: 15px;
            }

            .topic-title {
                font-size: 1rem;
            }

            .nav-buttons {
                padding: 10px;
            }

            .nav-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }

            .scroll-top {
                width: 40px;
                height: 40px;
                bottom: 80px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .logo span {
                font-size: 1rem;
            }

            .stat-value {
                font-size: 1.3rem;
            }

            .stat-label {
                font-size: 0.75rem;
            }

            .topic-number {
                width: 30px;
                height: 30px;
                font-size: 0.75rem;
            }

            .code-block {
                font-size: 0.75rem;
                padding: 10px;
            }
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-section {
            animation: fadeIn 0.5s;
        }

}

<script>
    let deferredPrompt;
const installPopup = document.getElementById('install-popup');
const installBtn = document.getElementById('install-btn');
const closePopup = document.getElementById('close-popup');

// Check if already installed
if (window.matchMedia('(display-mode: standalone)').matches || localStorage.getItem('appInstalled')) {
  installPopup.classList.add('hidden');
} else {
  // Listen for beforeinstallprompt event
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installPopup.classList.remove('hidden'); // Show popup
  });

  // Install button click
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      console.log('User accepted installation');
      installPopup.classList.add('hidden');
      localStorage.setItem('appInstalled', 'true');
    }
    deferredPrompt = null;
  });

  // Close button click
  closePopup.addEventListener('click', () => {
    installPopup.classList.add('hidden');
  });

  // When app is installed
  window.addEventListener('appinstalled', () => {
    console.log('App installed');
    localStorage.setItem('appInstalled', 'true');
    installPopup.classList.add('hidden');
  });




  
}

</script>

        let currentStageIndex = 0;
        const stageKeys = Object.keys(pythonData);
        let allTopics = [];
        
        Object.keys(pythonData).forEach(stage => {
            pythonData[stage].forEach(topic => {
                allTopics.push({...topic, stage});
            });
        });

        function renderNavTabs() {
            const navTabs = document.getElementById('navTabs');
            navTabs.innerHTML = stageKeys.map((stage, idx) => 
                `<button class="tab-btn ${idx === 1 ? 'active' : ''}" onclick="switchTab('${stage}', ${idx})">${stage}</button>`
            ).join('');
        }

        function switchTab(stage, index) {
            currentStageIndex = index;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-btn')[index].classList.add('active');
            renderContent(pythonData[stage]);
            updateNavButtons();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function navigateStage(direction) {
            currentStageIndex += direction;
            if (currentStageIndex >= 0 && currentStageIndex < stageKeys.length) {
                const stage = stageKeys[currentStageIndex];
                switchTab(stage, currentStageIndex);
            }
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentStageIndex === 0;
            document.getElementById('nextBtn').disabled = currentStageIndex === stageKeys.length - 1;
        }

        function renderContent(topics) {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="topic-grid">
                    ${topics.map(topic => `
                        <div class="topic-card">
                            <div class="topic-header">
                                <div class="topic-number">${topic.num}</div>
                                <div class="topic-title">${topic.title}</div>
                            </div>
                            <div class="topic-section">
                                <div class="section-label">🧩 Definition</div>
                                <div class="section-content">${topic.definition}</div>
                            </div>
                            <div class="topic-section">
                                <div class="section-label">💡 Why & Where Used</div>
                                <div class="section-content">${topic.why}</div>
                            </div>
                            <div class="topic-section">
                                <div class="section-label">⚙️ Syntax</div>
                                <div class="code-block"><code>${escapeHtml(topic.syntax)}</code></div>
                            </div>
                            <div class="topic-section">
                                <div class="section-label">🧠 Example</div>
                                <div class="code-block"><code>${escapeHtml(topic.example)}</code></div>
                            </div>
                            <div class="tip-box">
                                <strong>Tip:</strong> ${topic.tip}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query) {
                renderContent(pythonData[stageKeys[currentStageIndex]]);
                return;
            }

            const filtered = allTopics.filter(topic => 
                topic.title.toLowerCase().includes(query) ||
                topic.definition.toLowerCase().includes(query) ||
                topic.syntax.toLowerCase().includes(query) ||
                topic.example.toLowerCase().includes(query)
            );
            renderContent(filtered);
        });

        // Scroll to top
        const scrollTop = document.getElementById('scrollTop');
        window.addEventListener('scroll', () => {
            scrollTop.classList.toggle('visible', window.scrollY > 300);
        });
        scrollTop.addEventListener('click', () => {
            window.scrollTo({top: 0, behavior: 'smooth'});
        });

        // Initialize
        renderNavTabs();
        renderContent(pythonData["Stage 1"]);
        updateNavButtons();

            });
        }
    </script>
